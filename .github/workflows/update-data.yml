name: 株価データ更新

on:
  schedule:
    # 平日の東証の取引時間（前場・後場）のみ、15分おきに実行。
    # JST = UTC+9。前場 9:00-11:30 = UTC 0:00-2:30 / 後場 12:30-16:00 = UTC 3:30-7:00
    - cron: "*/15 0-1 * * 1-5"  # UTC 0:00,0:15,...,1:45
    - cron: "0,15,30 2 * * 1-5" # UTC 2:00,2:15,2:30
    - cron: "30,45 3 * * 1-5"   # UTC 3:30,3:45
    - cron: "*/15 4-6 * * 1-5"  # UTC 4:00,4:15,...,6:45
    - cron: "0 7 * * 1-5"       # UTC 7:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: 株価を取得して heatmap.json を更新
        run: python scripts/fetch_prices.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/heatmap.json; then
            echo "変更なし"
          else
            git add data/heatmap.json
            git commit -m "chore: 株価データ更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
