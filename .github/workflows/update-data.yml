name: 株価データ更新

on:
  schedule:
    # 平日のみ、指定した時刻に実行（JST = UTC+9）。
    # JST 9:30, 10:30, 11:45, 13:00, 14:00, 15:00, 16:00
    - cron: "30 0,1 * * 1-5"  # JST 9:30, 10:30
    - cron: "45 2 * * 1-5"    # JST 11:45
    - cron: "0 4-7 * * 1-5"   # JST 13:00, 14:00, 15:00, 16:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: 株価を取得して heatmap.json を更新
        run: python scripts/fetch_prices.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/heatmap.json; then
            echo "変更なし"
          else
            git add data/heatmap.json
            git commit -m "chore: 株価データ更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
