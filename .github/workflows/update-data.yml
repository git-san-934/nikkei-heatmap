name: 株価データ更新

on:
  schedule:
    # 平日のみ、指定した時刻に実行（JST = UTC+9）。
    # GitHub の schedule は毎時 0/15/30/45 分付近が混雑して遅延・スキップしやすいため、
    # 数分ずらした時刻にしている。
    # JST 9:33, 10:33, 11:48, 13:07, 14:07, 15:07, 16:07
    - cron: "33 0,1 * * 1-5"  # JST 9:33, 10:33
    - cron: "48 2 * * 1-5"    # JST 11:48
    - cron: "7 4-7 * * 1-5"   # JST 13:07, 14:07, 15:07, 16:07
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r scripts/requirements.txt

      - name: 株価を取得して heatmap.json を更新
        run: python scripts/fetch_prices.py

      - name: 変更があればコミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/heatmap.json; then
            echo "変更なし"
          else
            git add data/heatmap.json
            git commit -m "chore: 株価データ更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
